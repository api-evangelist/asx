apis:
- name: ASX Market Information Application (MIA) REST API
  description: REST programmatic interface to ASX Online's Market Information Application (Information Services), letting subscribers test connectivity,
    test token authentication, list the files of a subscribed product code and fetch product files. The authorisation token is generated in the
    MIA web application (www.asxonline.com/mia/a/auth_token) and sent in the Authorization header; one active token per user. ASX publishes no
    machine-readable contract (OpenAPI, AsyncAPI, WSDL) for this API.
  humanURL: https://asxonline.com/content/asxonline/public/documents/market-information-application--mia----rest-programmatic-interfa.html
  baseURL: https://api.asxonline.com/mia/1/mia-api
