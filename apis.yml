aid: asx

name: ASX

description: ASX Limited (ABN 98 008 624 691) operates the Australian Securities Exchange, Australia's primary securities exchange. The ASX Group's
  activities span primary and secondary market services, including capital formation and hedging, trading and price discovery, clearing and settlement,
  and connectivity and market data. Through ASX Information Services (ASX Online) it licenses price, reference, benchmark and company-announcement
  data to subscribers, with a documented REST programmatic interface and Java downloader for the Market Information Application.

